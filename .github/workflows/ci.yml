name: ci

# Один npm-workspace монорепо (backend + embed/loader + embed/app + panel) — один
# гейт: typecheck + тесты + сборка. Сборка = ЗАОДНО бюджет-гейт w.js:
# `embed/loader` package.json wire'ит `vite build && make-shim && size-check`
# в свой `build`-скрипт (потолок 8КБ gzip, embed/loader/scripts/size-check.mjs),
# так что отдельного шага "budget" не нужно — `npm run build --workspaces`
# падает сам, если бандл лоадера пролез за потолок.
#
# ubuntu-latest, а не self-hosted: у репозитория своих раннеров нет (см.
# аналогичное решение в ai-conversation-core/.github/workflows/*-tests.yml).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Вызывается из release.yml как ГЕЙТ ОБРАЗА. Именно вызов, а не копия джоб:
  # у ядра тот же гейт продублирован в build-and-push.yml, и его шапка честно
  # предупреждает «при правке менять ОБА файла» — здесь этой развилки нет,
  # правда одна. Дублировать пришлось бы, будь у ci.yml paths-фильтр
  # (workflow_call ждал бы того, кто не запустился), но фильтра нет.
  workflow_call:

# Свежий пуш в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + tests + build (incl. w.js budget gate)
    runs-on: ubuntu-latest
    # Потолок против повисшего шага, а не ожидаемое время: весь прогон —
    # минуты (npm ci + postgres + vitest + два vite build).
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Ставит все 4 воркспейса разом (root package-lock.json общий).
      - name: npm ci
        run: npm ci

      # Гейт дрейфа контракта ядра: вендорённая copy contracts/openapi.core.yaml
      # обязана совпадать с contracts/openapi.yaml ядра НА КОММИТЕ ИЗ ПИНА
      # (contracts/core.pin.json). Спеку тянет contracts/sync.mjs — на раннере
      # соседнего чекаута ядра нет, поэтому режим один: GitHub Contents API
      # с ?ref=<core_sha>.
      #
      # ПОЧЕМУ ТОЛЬКО secrets.CORE_CONTRACTS_TOKEN, без `|| github.token`.
      # Ядро (ivanyadeshko/ai-conversation-core) — ПРИВАТНЫЙ репозиторий, а
      # виджет — ПУБЛИЧНЫЙ; штатный github.token — installation-токен, скоуп
      # которого ограничен репозиторием прогона, и на чужое приватное ядро он
      # получит 404 (GitHub не подтверждает существование приватных репо).
      # Фолбэк `|| github.token` был бы хуже отсутствия фолбэка: GH_TOKEN
      # никогда не пуст → мягкая ветка ниже не сработала бы → гейт падал бы
      # ВСЕГДА и на всех PR, включая форки, с невнятным 404. Нужен отдельный
      # fine-grained PAT (read-only Contents на ядре) в секрете
      # CORE_CONTRACTS_TOKEN.
      #
      # МЯГКО ДО ЗАВЕДЕНИЯ СЕКРЕТА. Пока секрета нет — ::warning + exit 0, а не
      # красный CI: гейт вводится вместе с этим файлом, а секрет заводит человек
      # руками, и блокировать все PR репозитория на этот промежуток нечестно.
      # Побочный (и желаемый) эффект: на PR из форков секреты не пробрасываются
      # вовсе, и такой PR тоже не упрётся в 404 — он просто пройдёт без этого
      # гейта, а дрейф поймает прогон на ветке апстрима.
      - name: Гейт контракта ядра (пин contracts/core.pin.json)
        env:
          GH_TOKEN: ${{ secrets.CORE_CONTRACTS_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning title=Гейт дрейфа контракта неактивен::нет секрета CORE_CONTRACTS_TOKEN (fine-grained PAT, read-only Contents на ivanyadeshko/ai-conversation-core) — спека ядра не проверена"
            exit 0
          fi
          npm run contracts:check -w @aski/site-widget-backend

      # Тестовый Postgres — тот же compose-файл, что описан в backend/package.json
      # (`npm run db:test:up`) и которым разработчик поднимает БД локально:
      # порт 55433, БД widget_test — совпадает с фолбэком DATABASE_URL в
      # backend/test/helpers/globalSetup.ts, отдельно объявлять переменную
      # окружения в CI не нужно.
      - name: Start test postgres
        run: docker compose -f infra/compose.test.yaml up -d --wait

      # tsc (backend), vue-tsc (embed/app и panel), tsc (embed/loader) — по каждому
      # воркспейсу свой typecheck-скрипт.
      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      # vitest run в каждом воркспейсе. backend-тесты сами мигрируют тестовую
      # БД на старте (globalSetup) — миграции руками катать не нужно.
      - name: Test
        run: npm run test --workspaces --if-present

      # tsc → dist (backend) + vite build → dist (embed/loader, embed/app, panel).
      # embed/loader заодно прогоняет size-check.mjs (бюджет 8КБ gzip) —
      # это и есть бюджет-гейт w.js, встроенный в билд, а не отдельный шаг.
      - name: Build (incl. w.js budget gate)
        run: npm run build --workspaces --if-present

      - name: Teardown test postgres
        if: always()
        run: docker compose -f infra/compose.test.yaml down -v

  docker-build:
    name: infra/Dockerfile builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Гейт на сам факт сборки образа деплоя (infra/Dockerfile,
      # build.context=`..` — весь репозиторий). Ничего никуда не пушится —
      # публикация в GHCR осознанно вынесена за MVP (см. infra/deploy.sh:
      # раскатка = rsync исходников + сборка на месте до появления реестра).
      - name: docker build
        run: docker build -f infra/Dockerfile -t site-widget-backend:ci .

  site-build:
    name: site/Dockerfile builds (лендинг)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Гейт лендинга. Отдельная джоба, а не шаг в `test`: site/ — ОТДЕЛЬНЫЙ
      # npm-проект вне корневого workspace (решение D-10), у него свой
      # package-lock.json и свой `npm ci --legacy-peer-deps`; смешивать его
      # с корневым `npm ci` нельзя — peer-конфликты Payload/Next/React 19
      # сломали бы установку backend/embed/panel.
      #
      # Тестов у Payload-слоя нет (их нет и в apps/cms монолита; заводить
      # фреймворк ради лендинга — не наш скоуп), поэтому исполняемый гейт
      # здесь — факт сборки образа. Build-args обязательны: site/Dockerfile
      # валится fail-fast'ом, если домены не переданы (иначе кнопки лендинга
      # запеклись бы пустыми).
      - name: docker build (site)
        run: |
          docker build -f site/Dockerfile site/ -t vell-site:ci \
            --build-arg NEXT_PUBLIC_SERVER_URL=https://vell.pro \
            --build-arg NEXT_PUBLIC_APP_URL=https://app.vell.pro

  infra-checks:
    name: release.sh _selftest + nginx -t (vell.pro.conf)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Чистые bash-функции разбора .env и проверки merge'а сети ядра
      # (infra/deploy/release.sh): без docker, без .env. Гейт против регресса
      # логики, которая при поломке молча пропускает несмёрженный override сети
      # ядра (→ core_unreachable в проде) или ломает чтение .env.
      - name: release.sh _selftest
        run: bash infra/deploy/release.sh _selftest

      # nginx-конфиг vell.pro.conf в этап E не применяется (вход для G3), но
      # синтаксис его до тех пор ничем не защищён — гейтим `nginx -t` на той же
      # версии, что стоит на РФ-фронте (1.24; там нет директивы `http2 on`).
      # Конфиг ссылается на серт по фиксированному пути — генерим самоподписанный
      # ровно под него, содержимое серта для `nginx -t` роли не играет.
      - name: nginx -t (vell.pro.conf, nginx 1.24 = версия РФ-фронта)
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout certs/privkey.pem -out certs/fullchain.pem \
            -subj "/CN=vell.pro" \
            -addext "subjectAltName=DNS:vell.pro,DNS:www.vell.pro,DNS:app.vell.pro,DNS:cdn.vell.pro"
          docker run --rm \
            -v "$PWD/infra/nginx/vell.pro.conf:/etc/nginx/conf.d/vell.pro.conf:ro" \
            -v "$PWD/certs:/etc/letsencrypt/live/vell.pro:ro" \
            nginx:1.24-alpine nginx -t
