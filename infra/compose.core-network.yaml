# ─────────────────────────────────────────────────────────────────────────────
# Сетевой режим `attached` — BFF входит во внешнюю docker-сеть ядра.
#
# КОГДА НУЖЕН: только на стенде, который стоит РЯДОМ с ядром на одном хосте
# (дев-стенд: conversation-core биндит control-plane на 127.0.0.1:8100 —
# loopback, снаружи docker-моста недостижим, и единственный чистый маршрут
# BFF→ядро идёт по внутренней сети на http://control-plane:8000/api).
#
# КАК ВКЛЮЧАЕТСЯ — строкой в .env стенда (не флагом, не переменной compose):
#   COMPOSE_FILE=compose.yaml:compose.core-network.yaml
#   CORE_BASE_URL=http://control-plane:8000/api
# `COMPOSE_FILE` — штатный механизм самого compose, и он читается из .env
# проекта, то есть режим стенда описан там же, где остальная его конфигурация.
#
# ПОЧЕМУ OVERRIDE, А НЕ ФЛАГ В БАЗОВОМ ФАЙЛЕ (D-13): compose не умеет условный
# `external: true`. Любая форма «включить сеть переменной» всё равно оставляет
# объявление сети в графе, и `up` на хосте без стека ядра падает с
# «network … declared as external, but could not be found» — то есть прод
# витрины (где ядра нет и не будет) не поднимается вовсе.
#
# ⚠️ ФАЙЛ ОБЯЗАН ЛЕЖАТЬ РЯДОМ С compose.yaml НА СТЕНДЕ. Его кладёт шаг
# «Sync deploy assets» workflow'а deploy.yml. Если в .env уже прописан
# COMPOSE_FILE, а файла на хосте ещё нет — compose падает «no such file» на
# КАЖДОЙ команде, включая preflight. Порядок при первом включении: сначала
# файл на хост, потом строка в .env.
# ─────────────────────────────────────────────────────────────────────────────
services:
  backend:
    # `default` перечисляем явно: как только у сервиса появляется ключ
    # `networks`, compose перестаёт подключать его к сети по умолчанию сам, и
    # без этой строки BFF потерял бы widget-db.
    networks: [default, core]

networks:
  # Имя внешней сети правится переменной, а не файлом: на разных стендах
  # compose-проект ядра называется по-разному (дев: conversation-core_default).
  core:
    external: true
    name: ${CORE_NETWORK:-conversation-core_default}
