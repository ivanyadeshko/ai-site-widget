# ─────────────────────────────────────────────────────────────────────────────
# vell.pro — фронтовый http{}-периметр витрины виджета.
#
# ⚠️ В ЭТОМ ЭТАПЕ (E) ФАЙЛ НЕ ПРИМЕНЯЕТСЯ. Это вход для этапа G3 (DNS + TLS +
#    SNI-разводка на РФ-фронте). Здесь он живёт в репозитории, проверен
#    `nginx -t` и описывает целевую раскладку — но ни один стенд его не
#    подключает: на деве виджет слушает :8200 напрямую.
#
# КУДА ЕГО КЛАСТЬ (G3): /etc/nginx/sites-enabled/vell.pro.conf на РФ-фронте
# (aski-transport, YC, 89.169.151.253) — том же хосте, где стоит stream-релей
# `/etc/nginx/stream-aski.conf`.
#
# ПОЧЕМУ 127.0.0.1:9443 И proxy_protocol, А НЕ ОБЫЧНЫЙ 443.
# Внешний :443 на этом хосте занят stream-сервером с `ssl_preread on` и
# `proxy_protocol on`. Разводка по SNI (map $ssl_preread_server_name):
#   aski.pro-имена → origin_https (Аски),  vell.pro-имена → widget_local,
#   default        → origin_https (клиенты без SNI не ломаются).
# `widget_local` — ЭТОТ сервер, локальный апстрим 127.0.0.1:9443. Ограничение
# stream-релея ключевое: `proxy_protocol on` задаётся на уровне server и
# действует на ВЕСЬ :443 — то есть все локальные апстримы ОБЯЗАНЫ принимать
# PROXY-протокол. Отсюда `ssl proxy_protocol` в listen и real_ip ниже.
# Цепочка из двух stream-серверов (чтобы «снять» PROXY) не годится: она теряет
# адрес клиента, а на нём держится IP-кап BFF (MAX_DIALOGS_PER_IP_PER_DAY).
#
# СВЯЗКА С TRUST_PROXY. real_ip ниже подставляет адрес клиента в $remote_addr,
# и X-Forwarded-For уходит в BFF уже правильным. Но Fastify поверит заголовку
# ТОЛЬКО при `TRUST_PROXY=1` в .env стенда (backend/src/config.ts). Без него
# req.ip = адрес nginx, и IP-кап схлопнет всех посетителей в один бакет →
# массовые ложные 429. Поэтому preflight (infra/deploy/release.sh) делает это
# стоп-условием: https-origin без TRUST_PROXY=1 — `die`, а не warning.
#
# ДВА РАЗНЫХ /admin — НЕ ПЕРЕПУТАТЬ (риск, найденный на ревью):
#   • vell.pro/admin      — админка Payload CMS лендинга (site:3000);
#   • app.vell.pro/panel/admin — админка ОПЕРАТОРА витрины внутри SPA кабинета
#     (та же SPA, роль accounts.is_admin, API /api/v1/admin/*).
# Это разные системы с разными базами пользователей. Ниже они разведены по
# доменам ЯВНО: на apex закрыт /panel и /api/v1, на app.vell.pro закрыт /admin.
# Закрытие сделано `return 404`, а не отсутствием location: пустое место
# однажды перекроют широким `location /` — и периметры сольются молча.
#
# ТАЙМАУТЫ. `POST /w/v1/:token/dialogs` блокирующий: BFF ждёт ядро до 45с
# (`timeoutMs: 45_000`, backend/src/core/client.ts + server.ts; докстринг
# «до ~40с» рядом — устаревший текст, не другая константа). Дефолтные 60с
# nginx это переживает, но без запаса: ставим 90s, чтобы таймаут всегда
# случался у BFF (он вернёт осмысленный core_* код), а не у прокси (502).
#
# ВЕБСОКЕТОВ ЧЕРЕЗ ЭТОТ ПЕРИМЕТР НЕТ: голос идёт из iframe напрямую в LiveKit
# (см. WIDGET_CSP_CONNECT_SRC), BFF в медиа-тракте не участвует.
#
# .env СТЕНДА ОБЯЗАН СОВПАДАТЬ С ЭТИМИ ДОМЕНАМИ, иначе конфиг «работает», а
# продукт нет:
#   WIDGET_APP_ORIGIN=https://app.vell.pro   ← app_url iframe, доверенный
#                                              Origin публичного API
#   WIDGET_PANEL_ORIGIN=https://app.vell.pro ← единственный Origin, который
#                                              примут не-GET /api/v1 (D-5)
#   WIDGET_CDN_ORIGIN=https://cdn.vell.pro   ← отсюда сниппет зовёт w.js, и
#                                              ровно от этого расхождения в
#                                              сниппет добавляется data-host
#   TRUST_PROXY=1
# Все три имеют фолбэк на WIDGET_PUBLIC_ORIGIN, поэтому «забыл переменную» не
# ломает старт — оно молча возвращает однодоменное поведение.
# ─────────────────────────────────────────────────────────────────────────────

# Апстримы. Значения — опубликованные на localhost порты docker-стека виджета
# (infra/compose.yaml: backend `ports: 8200:8200`) и лендинга (site:3000,
# профиль `site`). Если nginx когда-нибудь переедет ВНУТРЬ compose-сети —
# заменить на имена сервисов `backend:8200` / `site:3000` и ничего больше.
upstream vell_bff {
    server 127.0.0.1:8200;
    keepalive 32;
}

upstream vell_site {
    server 127.0.0.1:3000;
    keepalive 16;
}

# В каждом server-блоке ниже X-Forwarded-Port задан ЯВНО (=443): клиент пришёл
# на ВНЕШНИЙ 443, а слушаем мы 9443 — без явного значения приложение соберёт
# себе ссылку с портом 9443 (у Аски этим уже отстрелили ногу: алерты site-down
# ловили редирект на :8443).
#
# HTTP/2 включён СТАРОЙ формой — параметром `listen … http2`, а не отдельной
# директивой `http2 on`. Это не небрежность: на РФ-фронте стоит nginx 1.24, где
# директивы `http2` ещё НЕТ вовсе, и конфиг с ней не проходит `nginx -t`
# («unknown directive "http2"») — проверено обеими версиями в контейнере.
# На 1.25.1+ старая форма работает и печатает deprecation-warning; чинить её
# на новую можно только вместе с апгрейдом nginx на фронте.

server {
    # Неизвестный SNI, попавший сюда по ошибке map'а stream-релея, не должен
    # получить ни один из vell-периметров: рвём соединение без ответа.
    listen 127.0.0.1:9443 ssl http2 proxy_protocol default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/vell.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vell.pro/privkey.pem;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    return 444;
}

# ── apex: лендинг + CMS ──────────────────────────────────────────────────────
server {
    listen 127.0.0.1:9443 ssl http2 proxy_protocol;
    server_name vell.pro www.vell.pro;

    ssl_certificate     /etc/letsencrypt/live/vell.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vell.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vell_tls:10m;
    ssl_session_timeout 1d;

    # PROXY-протокол приносит настоящий адрес клиента — доверяем ему только от
    # localhost (сам stream-релей на этом же хосте).
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    access_log /var/log/nginx/vell-access.log;
    error_log  /var/log/nginx/vell-error.log;

    # Payload грузит медиа через админку — apex единственный, кому нужен объём.
    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # includeSubDomains СОЗНАТЕЛЬНО НЕТ: он распространится на все *.vell.pro,
    # включая те, которых ещё нет (стенды, превью) — и заблокирует их по http
    # до выпуска сертификата. Включать после G3, когда домены устоятся.

    # Кабинет и его API живут ТОЛЬКО на app.vell.pro (см. шапку: два /admin).
    location = /panel      { return 404; }
    location ^~ /panel/    { return 404; }
    location ^~ /api/v1/   { return 404; }

    location / {
        proxy_pass http://vell_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;
        proxy_connect_timeout 5s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }
}

# ── app.vell.pro: BFF целиком (кабинет, API, iframe виджета, публичный API) ──
server {
    listen 127.0.0.1:9443 ssl http2 proxy_protocol;
    server_name app.vell.pro;

    ssl_certificate     /etc/letsencrypt/live/vell.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vell.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vell_tls:10m;
    ssl_session_timeout 1d;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    access_log /var/log/nginx/vell-access.log;
    error_log  /var/log/nginx/vell-error.log;

    # У Fastify bodyLimit 64 КБ (backend/src/app.ts) — держим тот же порядок,
    # чтобы отказ приходил от приложения кодом, а не обрывом на прокси.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Админка CMS живёт на apex и сюда не проксируется. Явный 404 — барьер от
    # будущего «а давайте один общий location»: два периметра администрирования
    # с разными базами пользователей не должны оказаться на одном хосте.
    location = /admin   { return 404; }
    location ^~ /admin/ { return 404; }

    location / {
        proxy_pass http://vell_bff;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;
        proxy_connect_timeout 5s;
        proxy_send_timeout    90s;
        # 90s > 45s таймаута CoreClient: таймаут обязан случиться у BFF с
        # осмысленным кодом ошибки, а не у прокси пустым 502.
        proxy_read_timeout    90s;
        # Буферизация ответа не мешает: /w/v1 отдаёт компактный JSON, SSE у
        # виджета нет (лента диалога тянется поллингом).
    }
}

# ── cdn.vell.pro: только статика лоадера ─────────────────────────────────────
server {
    listen 127.0.0.1:9443 ssl http2 proxy_protocol;
    server_name cdn.vell.pro;

    ssl_certificate     /etc/letsencrypt/live/vell.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vell.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vell_tls:10m;
    ssl_session_timeout 1d;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    access_log /var/log/nginx/vell-access.log;
    error_log  /var/log/nginx/vell-error.log;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # ACCESS-CONTROL-ALLOW-ORIGIN ЗДЕСЬ НЕ ДОБАВЛЯЕМ. Его ставит сам BFF
    # (`setHeaders` обоих fastifyStatic, backend/src/app.ts). Дубль `add_header`
    # дал бы ДВА заголовка ACAO в ответе, а браузер такой ответ отвергает
    # целиком — статика перестала бы грузиться ровно на чужих сайтах, ради
    # которых CDN и заводится.
    #
    # Отдаём РОВНО три класса путей: шим `/w.js`, хэшированный бандл
    # `/w.<hash>.js` и ассеты iframe-приложения `/assets/*`. Всё остальное на
    # CDN-хосте закрыто: ни API, ни кабинета, ни iframe-страницы здесь быть не
    # должно — куки сессии на этом домене не существует, и «случайно
    # заработавший» /panel был бы дырой в CSRF-барьере (D-5: не-GET /api/v1
    # проверяет Origin, равный WIDGET_PANEL_ORIGIN).
    # Якоря `$` на первых двух альтернативах ОБЯЗАТЕЛЬНЫ: без них regex
    # совпадает как ПРЕФИКС, и `/w.jsevil` или `/w.abc.js.map` тоже уезжали бы
    # на BFF — то есть заявленный здесь жёсткий allowlist на деле им не был
    # (находка кросс-ревью). У `assets/` якоря нет намеренно: под него нужны
    # и сам каталог, и всё его содержимое.
    location ~ ^/(?:w\.js$|w\.[A-Za-z0-9_-]+\.js$|assets/) {
        proxy_pass http://vell_bff;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        # Cache-Control приходит от BFF (immutable для /w.<hash>.js, 60s для
        # шима) — не перебиваем его здесь, иначе правило окажется в двух местах.
        #
        # ЭТОТ ХОСТ — «CDN» ТОЛЬКО ПО ИМЕНИ: proxy_cache здесь НЕ настроен, и
        # каждый запрос доходит до BFF. Кэшируют браузеры (по Cache-Control
        # выше), чего для бандла в единицы килобайт достаточно. Отдельный
        # proxy_cache_path добавится, если и когда появится нагрузка — это
        # осознанно отложено, а не забыто.
    }

    location / {
        return 404;
    }
}
