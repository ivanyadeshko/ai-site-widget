name: site-widget-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
      POSTGRES_DB: widget_test
    ports: ["55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widget_test"]
      interval: 2s
      timeout: 3s
      retries: 30
