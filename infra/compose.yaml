name: site-widget
services:
  backend:
    # Образ из GHCR, публикуется release.yml парой тегов sha-XXXXXXX + latest.
    # Раньше здесь стоял `site-widget-backend:local`, который собирался НА
    # СЕРВЕРЕ из залитых rsync'ом исходников. Отказались по двум причинам:
    # откатываться было не на что (артефакта сборка на месте не оставляет) и
    # деплоился не тот образ, что проверял CI (другое дерево, другой кэш слоёв).
    # IMAGE_OWNER — та же переменная, что читает preflight в
    # infra/deploy/release.sh. Раньше владелец был захардкожен здесь, а
    # скрипт брал его из .env: при переезде репозитория в организацию
    # publish шёл под новым владельцем, preflight проверял нового, а pull
    # тянул старого — «рычаг» IMAGE_OWNER был фальшивым.
    image: ${WIDGET_IMAGE:-ghcr.io/${IMAGE_OWNER:-ivanyadeshko}/site-widget-backend:${IMAGE_TAG:-latest}}
    # `build:` оставлен для ЛОКАЛЬНОЙ разработки (`docker compose up --build`).
    # На стенде он опасен: голый `up -d` с несуществующим тегом не падает, а
    # молча собирает образ из рабочего дерева и вешает на него запрошенный тег —
    # то есть катит чужой код под видом успешного деплоя. Поэтому release.sh
    # ходит строго `pull` + `up -d --no-build`.
    build: { context: "${WIDGET_BUILD_CONTEXT:-..}", dockerfile: infra/Dockerfile }
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Хост БД — УНИКАЛЬНОЕ имя widget-db, НЕ "postgres": backend присоединён и к
      # сети ядра (networks ниже), где у conversation-core свой контейнер с alias
      # "postgres" → DNS "postgres" резолвился бы в чужую БД ядра (роли widget там
      # нет → scram отдаёт 28P01 «password failed» вместо «нет роли», анти-энумерация).
      DATABASE_URL: postgres://widget:${POSTGRES_PASSWORD}@widget-db:5432/site_widget
      PORT: "8200"
    ports: ["8200:8200"]
    # Дев-стенд: ядро (conversation-core) биндит control-plane на 127.0.0.1:8100
    # (loopback, IPv6-firewall-фикс) — снаружи docker-моста недостижимо. Единственный
    # чистый маршрут BFF→ядро: присоединиться к сети ядра и ходить на внутренний
    # `http://control-plane:8000/api` (CORE_BASE_URL в .env). Вебхук ядро→BFF идёт
    # обратно на host-gateway conversation-core-сети (172.19.0.1:8200, опубликованный порт).
    networks: [default, core]
    depends_on:
      widget-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  widget-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: site_widget
    volumes: ["widget-pgdata:/var/lib/postgresql/data"]   # ИМЕНОВАННЫЙ том: анонимные жгут inode
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d site_widget"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  default:
  # Внешняя сеть ядра (conversation-core). BFF ходит в control-plane по ней.
  # На другом стенде имя иное — переопределяется COMPOSE-переменной не нужно,
  # правится здесь при переносе (дев: conversation-core_default).
  core:
    external: true
    name: ${CORE_NETWORK:-conversation-core_default}

volumes:
  widget-pgdata:
