name: site-widget
services:
  backend:
    # Образ из GHCR, публикуется release.yml парой тегов sha-XXXXXXX + latest.
    # Раньше здесь стоял `site-widget-backend:local`, который собирался НА
    # СЕРВЕРЕ из залитых rsync'ом исходников. Отказались по двум причинам:
    # откатываться было не на что (артефакта сборка на месте не оставляет) и
    # деплоился не тот образ, что проверял CI (другое дерево, другой кэш слоёв).
    # IMAGE_OWNER — та же переменная, что читает preflight в
    # infra/deploy/release.sh. Раньше владелец был захардкожен здесь, а
    # скрипт брал его из .env: при переезде репозитория в организацию
    # publish шёл под новым владельцем, preflight проверял нового, а pull
    # тянул старого — «рычаг» IMAGE_OWNER был фальшивым.
    image: ${WIDGET_IMAGE:-ghcr.io/${IMAGE_OWNER:-ivanyadeshko}/site-widget-backend:${IMAGE_TAG:-latest}}
    # `build:` оставлен для ЛОКАЛЬНОЙ разработки (`docker compose up --build`).
    # На стенде он опасен: голый `up -d` с несуществующим тегом не падает, а
    # молча собирает образ из рабочего дерева и вешает на него запрошенный тег —
    # то есть катит чужой код под видом успешного деплоя. Поэтому release.sh
    # ходит строго `pull` + `up -d --no-build`.
    build: { context: "${WIDGET_BUILD_CONTEXT:-..}", dockerfile: infra/Dockerfile }
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Хост БД — УНИКАЛЬНОЕ имя widget-db, НЕ "postgres": в режиме `attached`
      # (см. ниже) backend присоединён и к сети ядра, где у conversation-core
      # свой контейнер с alias "postgres" → DNS "postgres" резолвился бы в чужую
      # БД ядра (роли widget там нет → scram отдаёт 28P01 «password failed»
      # вместо «нет роли», анти-энумерация).
      DATABASE_URL: postgres://widget:${POSTGRES_PASSWORD}@widget-db:5432/site_widget
      PORT: "8200"
    ports: ["8200:8200"]
    # СЕТЕВОЙ РЕЖИМ. Базовый файл описывает режим `public`: BFF живёт в своей
    # сети и ходит в ядро по HTTPS (CORE_BASE_URL=https://api.ai-speak.ru/api).
    # Это единственный режим, возможный на проде витрины, где ядра рядом нет.
    #
    # Режим `attached` (стенд, стоящий РЯДОМ с ядром — дев) включается
    # override-файлом infra/compose.core-network.yaml через COMPOSE_FILE в .env:
    #   COMPOSE_FILE=compose.yaml:compose.core-network.yaml
    # Там ядро биндит control-plane на 127.0.0.1:8100 (loopback, IPv6-firewall-
    # фикс) и снаружи docker-моста недостижимо — единственный чистый маршрут
    # BFF→ядро там: войти во внешнюю сеть ядра и ходить на внутренний
    # `http://control-plane:8000/api`.
    depends_on:
      widget-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  widget-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: site_widget
    volumes: ["widget-pgdata:/var/lib/postgresql/data"]   # ИМЕНОВАННЫЙ том: анонимные жгут inode
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d site_widget"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── лендинг vell.pro (профиль `site`) ────────────────────────────────
  # Три сервиса под профилем: без COMPOSE_PROFILES=site в .env их для
  # `docker compose up` не существует — стенд, которому лендинг не нужен,
  # не платит за него ни контейнером, ни томом (решение D-12 плана).
  site-db:
    profiles: [site]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: ${SITE_DB_PASSWORD}
      POSTGRES_DB: vell_site
    # Порт на хост НЕ публикуем: в БД лендинга снаружи ходить незачем,
    # а открытый 5432 на стенде — лишняя поверхность.
    volumes: ["site-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d vell_site"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: катает миграции Payload и завершается. Сервис `site` стартует
  # только после его успешного выхода (service_completed_successfully) —
  # иначе Next поднялся бы на пустой схеме и отдавал 500 на каждой странице.
  site-migrate:
    profiles: [site]
    image: ${SITE_IMAGE:-ghcr.io/${IMAGE_OWNER:-ivanyadeshko}/vell-site:${IMAGE_TAG:-latest}}
    restart: "no"
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URI: postgres://site:${SITE_DB_PASSWORD}@site-db:5432/vell_site
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
    depends_on:
      site-db: { condition: service_healthy }

  site:
    profiles: [site]
    image: ${SITE_IMAGE:-ghcr.io/${IMAGE_OWNER:-ivanyadeshko}/vell-site:${IMAGE_TAG:-latest}}
    # `build:` — для локальной проверки (`docker compose --profile site build`).
    # На стенде release.sh ходит строго pull + up -d --no-build, как и с BFF.
    build:
      context: "${SITE_BUILD_CONTEXT:-../site}"
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    environment:
      DATABASE_URI: postgres://site:${SITE_DB_PASSWORD}@site-db:5432/vell_site
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      # Сид-роут деструктивен, по умолчанию выключен (404). См. site/README.
      ENABLE_SEED_ROUTES: ${ENABLE_SEED_ROUTES:-}
    ports: ["3000:3000"]
    # Загруженные в CMS картинки лежат в томе, а не в образе: пересборка
    # образа не должна стирать медиатеку.
    volumes: ["site-media:/app/public/media"]
    depends_on:
      site-migrate: { condition: service_completed_successfully }
    healthcheck:
      # /api/health не ходит в Payload/БД: здоровье контейнера не зависит от
      # того, засеян ли контент.
      #
      # 127.0.0.1, а НЕ localhost: standalone-сервер Next слушает только
      # IPv4 0.0.0.0:3000, а `localhost` внутри контейнера резолвится сначала
      # в ::1 — busybox-wget получает connection refused и контейнер вечно
      # висит unhealthy при полностью живом сервисе (проверено: 22 подряд
      # неудачных пробы, при этом curl снаружи отдаёт 200).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  default:
  # Сети ядра здесь БОЛЬШЕ НЕТ. Она вернулась в override-файл
  # infra/compose.core-network.yaml (режим `attached`, включается COMPOSE_FILE
  # в .env стенда). Причина: `external: true` нельзя сделать условным, а
  # безусловная внешняя сеть делала прод витрины структурно невозможным —
  # `up` падает «network … declared as external, but could not be found» на
  # любом хосте, где стека ядра нет.

volumes:
  widget-pgdata:
  # Тома лендинга. Создаются только когда профиль `site` активен.
  site-pgdata:
  site-media:
